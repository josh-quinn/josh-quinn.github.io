# Design critic calibration (spec 7.6): a generic page must fail, the reference must pass.
# Run through evals/run.ts (npm run eval:critic / eval:calibrate), never promptfoo directly:
# run.ts sets the telemetry lock-down. The real prompt is built by tools/gate/ai-eval.ts.
description: design-critic calibration
prompts:
  - 'design-critic case {{case}}'
# Backend/model pairs compared by calibration: one provider per pair, all running the same
# harness (evals/provider.mjs -> tools/gate/ai-eval.ts). `default` = the CLI's own default
# model. Copilot on this plan offers only its auto model; agy works headless (ADR 0004).
# Keep this list the same in both promptfooconfig.yaml files.
providers:
  - id: file://../provider.mjs
    label: claude:haiku
    config: { backend: claude, model: haiku }
  - id: file://../provider.mjs
    label: claude:sonnet
    config: { backend: claude, model: sonnet }
  - id: file://../provider.mjs
    label: copilot:default
    config: { backend: copilot, model: default }
  - id: file://../provider.mjs
    label: agy:default
    config: { backend: agy, model: default }
  - id: file://../provider.mjs
    label: agy:gemini-3.8-flash-medium
    config: { backend: agy, model: gemini-3.8-flash-medium }
defaultTest:
  vars:
    eval: design-critic
  assert:
    - type: javascript
      value: file://../expect-verdict.mjs
tests:
  - description: generic page (Tailwind defaults) must fail
    vars: { case: generic-page, expected: fail }
  - description: the reference itself must pass
    vars: { case: reference, expected: pass }
