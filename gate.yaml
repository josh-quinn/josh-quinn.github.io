# gate checks. `npm run gate -- task <id>` runs the `task` checks in order from the repo root,
# with GATE_TASK=<id> exported, and writes .gate/<id>/verdict.json + report.md.
# Each check: name, kind (deterministic | ai), run (sh -c), optional when (globs over files
# changed since the merge base with main), timeoutMs, backend, model.
# Exit 0 = pass, non-zero = fail; a missing tool (exit 126/127) or a timeout = error.
# Machine defaults (timeout, AI backend/model) live in ~/.config/jq-tools/gate/config.yaml.
version: 1
modes:
  task:
    checks:
      - name: build
        kind: deterministic
        run: npm run lint && npm run build

      - name: unit
        kind: deterministic
        run: npm run test:unit

      # tests/acceptance/<id>/ unchanged since the Gate-Test-Author commit.
      - name: integrity
        kind: deterministic
        run: npx tsx tools/gate/cli.ts integrity "$GATE_TASK"

      # A task without acceptance tests must not pass.
      - name: acceptance
        kind: deterministic
        run: >-
          if ! find "tests/acceptance/$GATE_TASK" -name '*.spec.ts' 2>/dev/null | grep -q .; then
          echo "gate: no acceptance tests in tests/acceptance/$GATE_TASK/; a task without acceptance tests cannot pass" >&2; exit 1; fi;
          npx playwright test "tests/acceptance/$GATE_TASK/"

      - name: axe
        kind: deterministic
        run: npm run test:a11y

      - name: privacy
        kind: deterministic
        run: npx playwright test tests/privacy/ && gitleaks git --config .gitleaks.toml --no-banner --redact .

      # Internal links in the build, offline (ADR 0005). External links: CI only.
      - name: links
        kind: deterministic
        run: lychee --offline --no-progress --root-dir "$PWD/dist" dist

      # DESIGN.md: colour, font and spacing only from tokens; no gradients.
      - name: stylelint
        kind: deterministic
        run: npm run lint:css

      # DESIGN.md never list: no CSS framework or component kit.
      - name: deps
        kind: deterministic
        run: npm run deps

      # Visual baselines (tests/visual/__screenshots__/), in the Linux Playwright image (needs Docker).
      - name: visual
        kind: deterministic
        run: sh scripts/visual.sh
        timeoutMs: 900000

      # AI checks (ADR 0003, models per docs/decisions/0006-ai-eval-models.md). Each prints one
      # {score, passes, issues, tokens} object; backend and model come from ai.<check name> in
      # ~/.config/jq-tools/gate/config.yaml. Local only; CI holds no AI tokens.
      - name: design-critic
        kind: ai
        when: ['src/**/*.{astro,css}', 'DESIGN.md']
        run: npm run build --silent >&2 && npx tsx tools/gate/ai-eval.ts design-critic --page index
        timeoutMs: 900000

      - name: auditor
        kind: ai
        run: npx tsx tools/gate/ai-eval.ts auditor
        timeoutMs: 900000

  # `npm run gate -- design <page>`: score one page (index = home, fonts = /_fonts/) against
  # DESIGN.md beside fresh reference screenshots (.cache/reference/, at most daily).
  design:
    checks:
      - name: refs
        kind: deterministic
        run: npx tsx scripts/reference-screens.ts

      - name: design-critic
        kind: ai
        run: npm run build --silent >&2 && npx tsx tools/gate/ai-eval.ts design-critic
        timeoutMs: 900000
